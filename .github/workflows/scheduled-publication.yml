name: Publish scheduled content
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduled-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-scheduled.mjs
      - name: Trigger the connected Cloudflare build only when content becomes due
        run: |
          if ! git diff --quiet -- content/scheduled-releases.json; then
            git config user.name 'NYDUCATI scheduler'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/scheduled-releases.json
            git commit -m 'Publish due scheduled content'
            git push origin HEAD:main
          fi
