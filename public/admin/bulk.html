<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex"><title>Content administration — NYDUCATI</title><style>body{font:16px/1.5 system-ui;max-width:1200px;margin:40px auto;padding:20px}input,select,button{font:inherit;padding:8px;margin:5px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}#status{white-space:pre-wrap}button{cursor:pointer}a{color:red}</style><a href="/admin/">← Editor</a><h1>Content administration</h1><p>Filter posts, pages and journeys; apply tags or publication changes to selected items in one save. Unsaved editor changes are not included.</p><button id="load">Load content</button><input id="search" placeholder="Search titles or tags" aria-label="Search content"><select id="kind" aria-label="Content type"><option value="">All types</option><option>post</option><option>page</option><option>journey</option></select><select id="state" aria-label="Publication status"><option value="">All statuses</option><option>draft</option><option>published</option><option>scheduled</option></select><p id="status" role="status"></p><div><select id="action" aria-label="Bulk action"><option value="add">Add tags</option><option value="remove">Remove tags</option><option value="draft">Revert to draft</option><option value="publish">Publish / enable schedule</option><option value="hide">Hide from post feed</option><option value="show">Show in post feed</option></select><input id="tags" placeholder="Tags, comma separated" aria-label="Tags for bulk action"><button id="apply" disabled>Apply to selected</button></div><table><thead><tr><th><input id="all" type="checkbox" aria-label="Select visible items"></th><th>Title</th><th>Type</th><th>Status</th><th>Tags</th></tr></thead><tbody></tbody></table><script type="module" src="/admin/bulk.js"></script></html>
