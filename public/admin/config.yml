        required: false
      - name: eyebrow
        label: Banner small heading
        widget: string
        required: false
      - name: sectionTitle
        label: Chapter section heading
        widget: string
        default: Explore the journey
      - name: numbering
        label: Chapter numbering
        widget: select
        options:
          - roman
          - numbers
          - none
        default: numbers
      - name: entries
        label: Included posts and pages — drag to reorder
        widget: list
        required: false
        types:
          - name: post
            label: Existing post
            widget: object
            summary: '{{fields.reference}}'
            fields:
              - name: reference
                label: Choose a post
                widget: relation
                collection: posts
                search_fields:
                  - title
                  - path
                value_field: path
                display_fields:
                  - title
                  - path
              - name: label
                label: Optional chapter title override
                widget: string
                required: false
              - name: description
                label: Optional summary override
                widget: text
                required: false
              - name: image
                label: Optional card image override
                widget: image
                required: false
                media_library:
                  allow_multiple: false
          - name: page
            label: Existing page
            widget: object
            summary: '{{fields.reference}}'
            fields:
              - name: reference
                label: Choose a page
                widget: relation
                collection: pages
                search_fields:
                  - title
                  - path
                value_field: path
                display_fields:
                  - title
                  - path
              - name: label
                label: Optional chapter title override
                widget: string
                required: false
              - name: description
                label: Optional summary override
                widget: text
                required: false
              - name: image
                label: Optional card image override
                widget: image
                required: false
                media_library:
                  allow_multiple: false
        hint: >-
          These are references, not copies. Editing a linked page changes it everywhere. Draft content is
          omitted from the published journey.
