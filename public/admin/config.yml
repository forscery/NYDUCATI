  - name: journeys
    label: Journeys
    label_singular: Journey
    folder: content/journeys
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{title}}'
    preview_path: '{{fields.path}}'
    preview_path_preserve_slashes: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: kind
        label: Content type
        widget: hidden
        default: journey
      - name: path
        label: Journey URL (automatic; optional override)
        widget: string
        hint: Defaults to /journeys/title/. Existing URLs stay unchanged unless deliberately edited.
        required: false
      - name: originalPath
        label: Last saved URL
        widget: hidden
        required: false
      - name: aliases
        label: Previous URLs / redirects
        widget: list
        required: false
        field:
          name: path
          label: Previous URL
          widget: string
      - name: publishedAt
        label: Publication date
        widget: datetime
        required: false
