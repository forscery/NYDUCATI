backend:
  name: github
  repo: forscery/NYDUCATI
  branch: main
  base_url: https://nyducati.hidden-silence-47e4.workers.dev
  auth_endpoint: auth
media_folder: public/uploads
public_folder: /uploads
collections:
  - folder: content/posts
    create: true
    extension: json
    format: json
    slug: post-{{slug}}
    summary: '{{title}}'
    sortable_fields:
      - title
      - publishedAt
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: kind
        label: Content type
        widget: hidden
        default: post
      - name: path
        label: Post URL (automatic; optional override)
        widget: string
        hint: >-
          Generated from the publication year/month and title. You can enter just a custom slug, such as
          two-wheel-tuesdays, or a complete local path. Saved URLs stay unchanged unless you edit them;
          changes create redirects.
        required: false
      - name: originalPath
        label: Last saved URL
        widget: hidden
        required: false
      - name: aliases
        label: Previous URLs / redirects
        widget: list
        required: false
        field:
          name: path
          label: Previous URL
          widget: string
      - name: publishedAt
        label: Publication date
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        hint: >-
          Defaults to today for new posts. Adjust to backdate a post; its automatic URL follows the year and
          month. Imported blank dates remain unchanged.
        default: '{{now}}'
      - name: publishedMonth
        label: Original archive month
        widget: hidden
        required: false
      - name: author
        label: Author
        widget: string
        default: Tigh Loughhead
      - name: tags
        label: Labels / tags
        widget: tags-text
        required: false
        hint: 'One text box: separate tags with commas or Enter. Spaces inside a tag are preserved.'
      - name: excerpt
        label: Excerpt
        widget: text
        required: false
      - name: draft
        label: Unpublished — exclude from website
        widget: boolean
        default: true
        hint: Use Publish or Revert to draft in the toolbar to change visibility.
      - name: showInFeed
        label: Include in feed, archives and search
        widget: boolean
        default: true
        hint: Turning this off leaves the direct URL public. It is not privacy protection.
      - name: location
        label: Location
        widget: place
        required: false
        hint: >-
          Search for a town, address, landmark or venue; choose a result to fill in its map link. Manual entry
          is also available.
      - name: hero
        label: Full-screen photo banner
        widget: object
        required: false
        fields:
          - name: image
            label: Photograph
            widget: image
            media_library:
              allow_multiple: false
          - name: titleColor
            label: Title and logo color
            widget: select
            options:
              - white
              - black
            default: white
          - name: position
            label: Photo focal point
            widget: string
            default: center
          - name: overlay
            label: Photo shading
            widget: number
            value_type: float
            min: 0
            max: 0.85
            step: 0.05
            default: 0.55
      - name: seo
        label: SEO overrides
        widget: object
        required: false
        fields:
          - name: title
            label: Search title
            widget: string
            required: false
          - name: description
            label: Meta description
            widget: text
            required: false
          - name: socialImage
            label: Social sharing image
            widget: image
            required: false
            media_library:
              allow_multiple: false
          - name: noindex
            label: Exclude from search engines
            widget: boolean
            default: false
            hint: The whole demo is currently noindex regardless of this setting.
      - name: style
        label: Article styling
        widget: object
        required: false
        fields:
          - name: width
            label: Text width
            widget: select
            options:
              - standard
              - wide
            default: standard
          - name: imageLayout
            label: Image width
            widget: select
            options:
              - standard
              - wide
            default: standard
      - name: mediaIssues
        label: Media needing attention (editor only)
        widget: list
        required: false
        summary: '{{fields.status}} — {{fields.filename}}'
        fields:
          - {name: id, widget: hidden, required: false}
          - name: status
            widget: select
            options: [needs_review, conversion_failed, missing, resolved]
            default: needs_review
          - {name: filename, label: Original filename, widget: string, required: false}
          - {name: source, label: Original URL or video ID, widget: text, required: false}
          - {name: date, label: Date reference, widget: string, required: false, hint: 'Label whether this is a capture date or post date. Unknown dates remain blank.'}
          - {name: reason, label: What needs attention, widget: text, required: false}
          - {name: replacementUrl, label: Replacement media or YouTube URL, widget: string, required: false}
      - name: videos
        label: YouTube videos below the article
        widget: list
        required: false
        fields:
          - name: url
            label: YouTube link
            widget: string
          - name: caption
            label: Caption
            widget: string
            required: false
      - name: format
        label: Content format
        widget: hidden
        default: markdown
      - name: order
        label: Imported collection order
        widget: hidden
        required: false
        default: 100
      - name: revisionBaseline
        label: Migration baseline
        widget: hidden
        required: false
      - name: metadataPending
        label: Original metadata pending
        widget: hidden
        required: false
      - name: images
        label: Original image references
        widget: hidden
        required: false
      - name: body
        label: Article — visual / Markdown source
        widget: richtext
        modes:
          - rich_text
          - raw
        hint: >-
          In Rich text mode, click Insert image → Upload / insert image, then choose a photograph from your
          computer or R2. The image appears in the article. Markdown shows editable source.
        editor_components:
          - image
    name: posts
    label: Posts
    filter:
      field: kind
      value: post
    preview_path: '{{fields.path}}'
    preview_path_preserve_slashes: true
