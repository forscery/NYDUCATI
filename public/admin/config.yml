        field: tags
      - label: Publication year
        field: publishedAt
        pattern: \d{4}
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site administration
        file: site.config.json
        format: json
        fields:
          - name: title
            label: Site title
            widget: string
          - name: tagline
            label: Tagline
            widget: string
          - name: branding
            label: Logo
            widget: object
            fields:
              - name: logoImage
                label: Logo image
                widget: image
                media_library:
                  allow_multiple: false
              - name: logoFontFamily
                label: Logo typeface
                widget: string
                default: Reflex Pro Regular
              - name: logoWebfontUrl
                label: Reflex Pro Regular webfont file URL
                widget: string
                required: false
          - name: navigation
            label: Navigation
            widget: list
            fields:
              - name: label
                label: Menu label
                widget: string
              - name: href
                label: Link
                widget: string
              - name: visible
                label: Show in menu
                widget: boolean
                default: true
              - name: children
                label: Submenu links
                widget: list
                required: false
                fields:
                  - name: label
                    label: Label
                    widget: string
                  - name: href
                    label: Link
                    widget: string
                  - name: visible
                    label: Visible
                    widget: boolean
                    default: true
          - name: home
            label: Homepage
            widget: object
            fields:
              - name: showFeaturedJourney
                label: Show banner
                widget: boolean
              - name: showStoryGrid
                label: Show masonry grid
                widget: boolean
              - name: hero
                label: Homepage photo banner
                widget: object
                fields:
                  - name: title
                    label: Title
                    widget: string
                  - name: titleEmphasis
                    label: Italic words in title
                    widget: string
                    required: false
                  - name: titleBreakBeforeEmphasis
                    label: Start italic words on a new line
                    widget: boolean
                    default: false
                    required: false
                  - name: subtitle
                    label: Subtitle
                    widget: text
                  - name: image
                    label: Banner photograph
                    widget: image
                    media_library:
                      allow_multiple: false
                  - name: titleColor
                    label: Title color
                    widget: select
                    options:
                      - label: White
                        value: white
                      - label: Black
                        value: black
                    default: white
                  - name: position
                    label: Photo focal point
                    widget: string
                    default: center
                    hint: 'Examples: center, 50% 30%, left center'
                  - name: overlay
                    label: Contrast overlay
                    widget: number
                    value_type: float
                    min: 0
                    max: 0.85
                    step: 0.05
                    default: 0.55
              - name: postsPerPage
                label: Posts per page
                widget: number
                value_type: int
                min: 3
                max: 30
                default: 12
          - name: articleHeroes
            label: Article and page banners
            widget: list
            summary: '{{fields.path}} — {{fields.titleColor}} title'
            fields:
              - name: path
                label: Existing article or page URL
                widget: string
              - name: image
                label: Banner photograph
                widget: image
                media_library:
                  allow_multiple: false
              - name: titleColor
                label: Title color
                widget: select
                options:
                  - label: White
                    value: white
                  - label: Black
                    value: black
                default: white
              - name: position
                label: Photo focal point
                widget: string
                default: center
                hint: 'Examples: center, 50% 30%, left center'
              - name: overlay
                label: Contrast overlay
                widget: number
                value_type: float
                min: 0
                max: 0.85
                step: 0.05
                default: 0.55
          - name: indexingEnabled
            label: Allow search engines to index the website
            widget: boolean
            default: false
            hint: Leave OFF during preview. Enable only when the full site is ready for production.
          - name: featuredJourneyPath
            label: Homepage featured journey
            widget: relation
            collection: journeys
            search_fields:
              - title
              - path
            value_field: path
            display_fields:
              - title
            required: false
            hint: Select a Journey here. Edit its content in the Journeys collection.
          - name: articleDefaults
            label: Default article layout
            widget: object
            required: false
            fields:
              - name: width
                label: Text width
                widget: select
                options:
                  - standard
                  - wide
                default: standard
              - name: imageLayout
                label: Image width
                widget: select
                options:
                  - standard
                  - wide
                default: standard
          - name: analytics
            label: Analytics and verification
            widget: object
            required: false
            fields:
              - name: enabled
                label: Enable tracking on production domains only
                widget: boolean
                default: false
              - name: hosts
                label: Production hostnames
                widget: list
                default:
                  - www.nyducati.com
                  - nyducati.com
                hint: No https:// prefix. Preview hosts will not send analytics.
              - name: ga4
                label: GA4 measurement ID
                widget: string
                required: false
                pattern:
                  - ^$|^G-[A-Z0-9]+$
                  - Use G-…
              - name: gtm
                label: Google Tag Manager ID (takes precedence over GA4)
                widget: string
                required: false
                pattern:
                  - ^$|^GTM-[A-Z0-9]+$
                  - Use GTM-…
                hint: >-
                  Configure GA4 and other analytics tools inside this container. Do not duplicate the same
                  tag.
              - name: searchConsole
                label: Google Search Console verification token
                widget: string
                required: false
media_library:
  name: nyducati-r2
display_url: https://nyducati.hidden-silence-47e4.workers.dev
site_url: https://nyducati.hidden-silence-47e4.workers.dev
